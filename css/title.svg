<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-label="SPEED">
  <defs>
    <linearGradient id="titleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a6f96"/>
      <stop offset="45%" stop-color="#4190bb"/>
      <stop offset="100%" stop-color="#6ec4ef"/>
    </linearGradient>
    <linearGradient id="titleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f66439"/>
      <stop offset="100%" stop-color="#ff9a5c"/>
    </linearGradient>
    <linearGradient id="streak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- speed streaks -->
  <g opacity="0.85">
    <path d="M40 118 H320" stroke="url(#streak)" stroke-width="3" stroke-linecap="round"/>
    <path d="M580 118 H860" stroke="url(#streak)" stroke-width="3" stroke-linecap="round"/>
    <path d="M120 148 H260" stroke="url(#streak)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M640 148 H780" stroke="url(#streak)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- hex accents -->
  <g fill="none" stroke="#4190bb" stroke-width="3" opacity="0.9">
    <polygon points="118,72 148,90 148,126 118,144 88,126 88,90"/>
    <polygon points="782,72 812,90 812,126 782,144 752,126 752,90"/>
  </g>
  <g fill="none" stroke="#f66439" stroke-width="2.5" opacity="0.95">
    <polygon points="118,86 134,96 134,120 118,130 102,120 102,96"/>
    <polygon points="782,86 798,96 798,120 782,130 766,120 766,96"/>
  </g>

  <!-- wordmark -->
  <g filter="url(#glow)">
    <text
      x="450"
      y="168"
      text-anchor="middle"
      font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif"
      font-size="132"
      font-weight="900"
      letter-spacing="18"
      fill="url(#titleBlue)"
      stroke="#ffffff"
      stroke-width="1.5"
      paint-order="stroke fill"
    >SPEED</text>
  </g>

  <!-- accent underline -->
  <path d="M250 198 H650" stroke="url(#titleAccent)" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  <path d="M305 214 H595" stroke="url(#titleAccent)" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <!-- tagline -->
  <text
    x="450"
    y="248"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="10"
    fill="#4190bb"
    opacity="0.92"
  >FUTURISTIC RACING</text>
</svg>
